# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

org.gradle.configuration-cache=true
org.gradle.unsafe.isolated-projects=true
org.gradle.caching=true

# NumVerify API configuration, surfaced as BuildConfig.API_KEY / BuildConfig.BASE_URL by the
# `numverify.android.application` convention plugin. Override either value in
# ~/.gradle/gradle.properties (or with -P on the command line) to build against a different
# account or environment without editing a version-controlled file.
numverify.apiKey=8bcc9700ca098d33c36a21d7041ee074
numverify.baseUrl=https://apilayer.net/api/

# How the `numverify.*` convention plugins are resolved by settings.gradle.kts:
#   includedBuild - built from source via `includeBuild("build-logic")`. A fresh clone works with
#                   no setup and edits to a convention plugin take effect on the next build.
#   maven         - resolved from mavenLocal as a published jar, which keeps the `build-logic`
#                   build out of every invocation entirely. Run
#                   `./gradlew -p build-logic publishToMavenLocal` first, and again after every
#                   change to build-logic, or the build silently uses a stale jar.
# `./benchmark-buildlogic.sh` benchmarks the two against each other.
numverify.buildLogic.source=includedBuild

# Coordinate version for the published convention plugins. Read by both the publishing side
# (build-logic/convention/build.gradle.kts) and the consuming side (settings.gradle.kts), so the
# two can never drift. Bump by hand when republishing.
numverify.buildLogic.version=0.1.0
